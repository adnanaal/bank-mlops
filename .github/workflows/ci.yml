name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: bank_api
          POSTGRES_PASSWORD: ci-postgres
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bank_api" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      API_DB_DSN: postgresql://api_writer:5mlde-local-api@127.0.0.1:15432/bank_api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Schéma de traçabilité
        env:
          PGPASSWORD: ci-postgres
          API_DB_PASSWORD: 5mlde-local-api
          GRAFANA_DB_PASSWORD: 5mlde-local-grafana
        run: psql -h 127.0.0.1 -p 15432 -U postgres -d bank_api -f db/init-db.sql
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest
