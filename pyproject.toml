[project]
name = "bank-mlops"
version = "0.1.0"
description = "Projet final 5MLDE : chaîne MLOps de bout en bout sur UCI Bank Marketing"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas==2.2.3",
  "numpy==2.2.6",
  "scikit-learn==1.6.1",
  "joblib==1.5.1",
  "great-expectations==1.23.2",
  "mlflow==3.16.1",
  "prefect==3.8.7",
  "fastapi",
  "uvicorn",
  "psycopg[binary,pool]",
  "httpx",
]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.12", "locust==2.46.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
